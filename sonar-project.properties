# Analyse SonarQube d'EduVox (lancée par Jenkins)
sonar.projectKey=eduvox
sonar.projectName=EduVox - Plateforme éducative (Django)
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

sonar.sources=apps,ai_services,config,templates
sonar.tests=apps
sonar.test.inclusions=**/tests.py,**/tests/**
sonar.exclusions=**/migrations/**,**/node_modules/**,src/assets/vendor/**,staticfiles/**,**/tests.py,**/tests/**
sonar.python.version=3.11
# Couverture produite par l'étape « Tests et couverture »
sonar.python.coverage.reportPaths=rapports/coverage.xml