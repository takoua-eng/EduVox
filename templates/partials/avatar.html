{% if utilisateur.photo_profil %}
  <img src="{{ utilisateur.photo_profil.url }}" alt="{{ utilisateur.username }}" class="rounded-circle" style="width: 100%; height: 100%; object-fit: cover;" />
{% else %}
  <span class="avatar-initial rounded-circle bg-label-primary">{{ utilisateur.first_name|default:utilisateur.username|slice:":1"|upper }}{{ utilisateur.last_name|slice:":1"|upper }}</span>
{% endif %}
