{% if is_paginated %}
<nav class="mt-6" aria-label="Pagination des défis">
  <ul class="pagination justify-content-center mb-0">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if params %}&amp;{{ params }}{% endif %}">Précédent</a></li>
    {% endif %}
    <li class="page-item active" aria-current="page"><span class="page-link">Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if params %}&amp;{{ params }}{% endif %}">Suivant</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
