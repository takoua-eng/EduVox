{# Styles du module assistant (dans un template : le .gitignore commun ignore les dossiers static/ des apps) #}
<style>
.assistant-module {
  --ast-vert: #047857; --ast-vert-fonce: #064e3b; --ast-sarcelle: #0f766e; --ast-fond: #f3f8f6;
  --ast-bord: #d5e6df; --ast-texte: #1f2a27; --ast-doux: #4b5a55; --ast-rouge: #b91c1c; --ast-ambre: #92400e;
}

/* ---------- Accessibilité ---------- */
.assistant-module a:focus-visible, .assistant-module button:focus-visible, .assistant-module input:focus-visible,
.assistant-module select:focus-visible, .assistant-module textarea:focus-visible, .assistant-module summary:focus-visible,
.assistant-module [tabindex]:focus-visible { outline: 3px solid var(--ast-vert-fonce); outline-offset: 2px; box-shadow: none; }
.assistant-module .ast-doux { color: var(--ast-doux); }
.assistant-module .ast-erreur { color: var(--ast-rouge); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .assistant-module * { animation: none !important; transition: none !important; } }

/* ---------- Bandeau ---------- */
.ast-hero { position: relative; overflow: hidden; border-radius: 1rem; padding: 1.75rem; color: #fff;
  background: radial-gradient(circle at 85% 15%, rgba(255,255,255,.16), transparent 42%),
              linear-gradient(135deg, var(--ast-vert-fonce) 0%, var(--ast-vert) 55%, var(--ast-sarcelle) 100%); }
.ast-hero h1, .ast-hero h2 { color: #fff; }
.ast-hero p { color: #ecfdf5; }
.ast-hero .btn-light { color: var(--ast-vert-fonce); font-weight: 600; }
.ast-hero .btn-outline-light:hover { color: var(--ast-vert-fonce); }
.ast-hero-stats { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1.25rem; }
.ast-hero-stat strong { display: block; font-size: 1.5rem; line-height: 1.2; font-family: 'Poppins', sans-serif; }
.ast-hero-stat span { color: #d1fae5; font-size: .875rem; }

/* ---------- Badges (toujours avec un texte) ---------- */
.ast-badge { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .6rem; border-radius: 2rem;
  font-size: .8125rem; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.ast-badge--ouverte { color: #064e3b; background: #d1fae5; border-color: #6ee7b7; }
.ast-badge--fermee { color: #27272a; background: #ececf1; border-color: #c9c8d3; }
.ast-badge--attente { color: #78350f; background: #fef3c7; border-color: #fbbf24; }
.ast-badge--erreur { color: #7f1d1d; background: #fee2e2; border-color: #fca5a5; }
.ast-badge--info { color: #134e4a; background: #ccfbf1; border-color: #5eead4; }

/* ---------- Liste des sessions ---------- */
.ast-grille { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.ast-carte { height: 100%; border: 1px solid var(--ast-bord); border-radius: .875rem; background: #fff;
  padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; transition: box-shadow .15s, transform .15s; }
.ast-carte:hover { box-shadow: 0 6px 20px rgba(4, 120, 87, .12); transform: translateY(-2px); }
.ast-carte h3 { font-size: 1.0625rem; margin: 0; }
.ast-carte h3 a { color: var(--ast-texte); }
.ast-carte h3 a::after { content: ""; position: absolute; inset: 0; }
.ast-carte { position: relative; }
.ast-carte .ast-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .875rem; color: var(--ast-doux); margin-top: auto; }
.ast-onglets { display: flex; flex-wrap: wrap; gap: .25rem; }
.ast-onglets a { padding: .4rem .9rem; border-radius: 2rem; color: var(--ast-doux); border: 1px solid transparent; }
.ast-onglets a[aria-current="page"] { color: #fff; background: var(--ast-vert); }
.ast-onglets a:hover:not([aria-current]) { border-color: var(--ast-bord); }

/* ---------- Conversation ---------- */
.ast-chat { display: flex; flex-direction: column; gap: 1rem; max-height: 62vh; min-height: 280px; overflow-y: auto;
  padding: 1.25rem; background: var(--ast-fond); border-radius: .875rem; border: 1px solid var(--ast-bord); }
.ast-vide { margin: auto; text-align: center; color: var(--ast-doux); max-width: 420px; }
.ast-vide i { font-size: 2.5rem; color: var(--ast-vert); }
.ast-suggestions { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1rem; }
.ast-message { display: flex; gap: .75rem; max-width: 88%; }
.ast-message--question { align-self: flex-end; flex-direction: row-reverse; }
.ast-avatar { flex: 0 0 2.25rem; height: 2.25rem; border-radius: 50%; display: grid; place-items: center;
  font-size: 1.1rem; color: #fff; background: var(--ast-vert); }
.ast-message--question .ast-avatar { background: #3f3d56; }
.ast-bulle { border-radius: 1rem; padding: .75rem 1rem; background: #fff; border: 1px solid var(--ast-bord);
  color: var(--ast-texte); min-width: 0; overflow-wrap: anywhere; }
.ast-message--question .ast-bulle { background: #e7f6f0; border-color: #b7e0cf; }
.ast-bulle .ast-entete { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; font-size: .8125rem;
  color: var(--ast-doux); margin-bottom: .35rem; }
.ast-contenu > :last-child { margin-bottom: 0; }
.ast-contenu pre { background: #1f2937; color: #f9fafb; padding: .75rem; border-radius: .5rem; overflow-x: auto; }
.ast-contenu code { color: #9d174d; }
.ast-contenu pre code { color: inherit; }
.ast-contenu table { border-collapse: collapse; margin: .5rem 0; }
.ast-contenu th, .ast-contenu td { border: 1px solid var(--ast-bord); padding: .3rem .6rem; }
.ast-flux { white-space: pre-wrap; }
.ast-actions { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .5rem; }
.ast-actions .btn { padding: .2rem .55rem; font-size: .8125rem; }
.ast-actions .btn[aria-pressed="true"] { background: var(--ast-vert); color: #fff; border-color: var(--ast-vert); }
.ast-actions form { display: inline; }
.ast-audio { width: 100%; max-width: 280px; height: 36px; margin-top: .25rem; }
.ast-points span { display: inline-block; width: .45rem; height: .45rem; margin-right: .2rem; border-radius: 50%;
  background: var(--ast-vert); animation: ast-rebond 1.2s infinite ease-in-out; }
.ast-points span:nth-child(2) { animation-delay: .15s; } .ast-points span:nth-child(3) { animation-delay: .3s; }
@keyframes ast-rebond { 0%, 80%, 100% { transform: scale(.5); opacity: .4 } 40% { transform: scale(1); opacity: 1 } }

/* ---------- Saisie ---------- */
.ast-saisie { border: 1px solid var(--ast-bord); border-radius: .875rem; padding: .75rem; background: #fff; }
.ast-saisie textarea { resize: vertical; min-height: 3rem; border: 0; box-shadow: none !important; }
.ast-micro { width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.35rem; }
.ast-micro[aria-pressed="true"] { background: var(--ast-rouge); border-color: var(--ast-rouge); color: #fff;
  animation: ast-pulse 1.4s infinite; }
@keyframes ast-pulse { 0% { box-shadow: 0 0 0 0 rgba(185,28,28,.45) } 70% { box-shadow: 0 0 0 12px rgba(185,28,28,0) } 100% { box-shadow: 0 0 0 0 rgba(185,28,28,0) } }
.ast-etat { font-size: .875rem; color: var(--ast-doux); min-height: 1.3rem; }
.ast-connexion { display: inline-flex; align-items: center; gap: .35rem; font-size: .8125rem; color: var(--ast-doux); }
.ast-connexion::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: #9ca3af; }
.ast-connexion[data-etat="ok"]::before { background: #059669; }
.ast-connexion[data-etat="repli"]::before { background: #d97706; }

/* ---------- Illustrations ---------- */
.ast-illustrations { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.ast-illustration { border: 1px solid var(--ast-bord); border-radius: .875rem; background: #fff; overflow: hidden;
  display: flex; flex-direction: column; }
.ast-illustration figure { margin: 0; }
.ast-illustration img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--ast-fond); }
.ast-illustration figcaption, .ast-illustration .ast-ill-corps { padding: .75rem; font-size: .875rem; }
.ast-mermaid { padding: .75rem; background: #fff; overflow-x: auto; min-height: 120px; display: grid; place-items: center; }
.ast-mermaid svg { max-width: 100%; height: auto; }
.ast-chargement { aspect-ratio: 1; display: grid; place-items: center; background: var(--ast-fond); color: var(--ast-doux);
  text-align: center; padding: 1rem; }

/* ---------- Statistiques ---------- */
.ast-kpi { border: 1px solid var(--ast-bord); border-radius: .875rem; padding: 1rem 1.25rem; background: #fff; height: 100%; }
.ast-kpi strong { display: block; font-size: 1.75rem; font-family: 'Poppins', sans-serif; color: var(--ast-texte); }
.ast-kpi span { color: var(--ast-doux); font-size: .875rem; }
.ast-jauge { height: .5rem; border-radius: 1rem; background: #e5e7eb; overflow: hidden; }
.ast-jauge > div { height: 100%; background: var(--ast-vert); }

@media (max-width: 575.98px) {
  .ast-message { max-width: 100%; }
  .ast-chat { max-height: 58vh; padding: .75rem; }
  .ast-hero { padding: 1.25rem; }
}
</style>
